name: Bug report
description: Report a problem with dsh-mood (wrong Mood, install failure, crash, etc.)
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A good report includes the environment and a minimal reproduction.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the wrong/crashing behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimum steps, and what Mood/signals you saw vs expected (😊/😕/😤/🤯, why text, journey).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: dsh-mood version + DeepSeek Harness version.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
      default: 0
  - type: input
    id: node
    attributes:
      label: Node.js version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / config
      description: Your `cordis.patch.yml` mood config and any install/load error output.
      render: text
