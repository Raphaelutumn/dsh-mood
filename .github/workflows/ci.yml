name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify package (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The standalone package ships prebuilt lib/ (built from the DeepSeek
      # Harness monorepo). CI validates the package and packs it, with no
      # runtime dependency install. Commands use YAML block scalars so colons
      # inside the checked strings are never parsed as mapping keys.
      - name: Validate package.json
        run: >-
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client?.platform) throw new Error('dsh bundle/client manifest missing'); console.log('manifest ok:', p.name, p.version)"

      - name: Verify shipped lib
        run: >-
          node -e "for (const f of ['index.js','client.js','invariant.js']) require('node:fs').accessSync('lib/'+f); console.log('lib ok')"

      - name: Validate cordis.patch.yml
        run: >-
          node -e "const fs=require('node:fs'), s=fs.readFileSync('cordis.patch.yml','utf8'); if(!/id: mood/.test(s)||!/id: ui-mood/.test(s)) throw new Error('patch rows missing'); console.log('patch ok')"

      - name: Pack
        run: npm pack --pack-destination .out
      - name: Upload pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mood-${{ matrix.os }}-node${{ matrix.node }}
          path: .out/*.tgz
